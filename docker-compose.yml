# Runs the inventory API and a self-hosted n8n (Community Edition) side by side.
#   cp .env.example .env      # set API_KEY and WEBHOOK_SECRET
#   (cd n8n/custom-node && npm install && npm run build)   # optional custom nodes
#   docker compose up -d
#   docker compose --profile tunnel up -d   # also start a public URL for Zapier and Make
name: inventory-automation

services:
  app:
    build: ./app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      STORE_NAME: ${STORE_NAME:-Trailhead Supply Co.}
      DATA_FILE: /data/db.json
      # Event -> URL routes. The defaults feed n8n workflows 01 and 02.
      # Override in .env to add your Make webhook (docs/SETUP-MAKE.md).
      WEBHOOK_SUBSCRIPTIONS: ${WEBHOOK_SUBSCRIPTIONS:-order.created=http://n8n:5678/webhook/inv-order-created,inventory.low_stock=http://n8n:5678/webhook/inv-low-stock}
    volumes:
      - app_data:/data

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.44.5}
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: ${TZ:-America/New_York}
      TZ: ${TZ:-America/New_York}
      # Webhook URLs n8n gives out. The app container reaches n8n by its service name,
      # which is what the Inventory Trigger node registers with the API.
      WEBHOOK_URL: http://n8n:5678/
      # Locally built nodes (n8n/custom-node/dist) load from here as CUSTOM.inventory / CUSTOM.inventoryTrigger.
      N8N_CUSTOM_EXTENSIONS: /opt/n8n-custom
      # Workflows 01 and 02 read $env.INVENTORY_API_URL. n8n 2.x blocks $env unless this is exactly "false".
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      INVENTORY_API_URL: http://app:3000
      # Used by the optional "Verify signature" Code node in workflow 01.
      INVENTORY_WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      # Uncomment if you open the editor from another machine over plain http.
      # N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/custom-node/dist:/opt/n8n-custom/n8n-nodes-inventory:ro
    depends_on:
      - app

  # Optional: a free, temporary public HTTPS URL for the API so Zapier and Make can call it.
  # The URL (https://<random>.trycloudflare.com) appears in: docker compose logs tunnel
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on:
      - app

volumes:
  app_data:
  n8n_data:
