# Inventory and order API as one AWS Lambda function behind API Gateway, answering from mock data in memory
# (src/mockData.ts). Make's custom app and scenarios call it over HTTPS.
#   Local:  npm run dev      (serverless-offline: the same Lambda, on http://localhost:3000)
#   Deploy: npm run deploy   (docs/DEPLOY-AWS.md)
service: inventory-sample-api
frameworkVersion: '3'
# Load backend/.env (and .env.<stage> if present, e.g. .env.prod) for every command: deploy, offline, info
useDotenv: true

provider:
  name: aws
  # Serverless v3's schema predates nodejs22.x, so it prints a "configuration warning" for this line; AWS and serverless-offline accept it
  runtime: nodejs22.x
  architecture: arm64 # Graviton: about 20% cheaper than x86 for the same work
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 256
  timeout: 10
  logRetentionInDays: 30
  versionFunctions: false
  
  environment:
    STORE_NAME: ${env:STORE_NAME, 'Test Company Name'}
    # From backend/.env (useDotenv above); a value already set in your shell wins
    API_KEY: ${env:API_KEY}
    # Optional: a Make custom webhook URL that receives every event
    WEBHOOK_URL: ${env:WEBHOOK_URL, ''}

functions:
  # The whole API is one function, src/handler.ts. Each route below is matched by API Gateway and handed to it.
  api:
    handler: src/handler.handler
    events:
      - httpApi: 'GET /health'
      - httpApi: 'GET /api/me'
      - httpApi: 'GET /api/products'
      - httpApi: 'GET /api/products/{sku}'
      - httpApi: 'GET /api/orders'
      - httpApi: 'POST /api/orders'
      - httpApi: 'GET /api/orders/{id}'
      - httpApi: 'POST /api/orders/{id}/status'
      - httpApi: 'GET /api/purchase-orders'
      - httpApi: 'POST /api/purchase-orders'
      - httpApi: 'POST /api/purchase-orders/{id}/status'
      - httpApi: 'GET /api/inventory/report'
      - httpApi: 'POST /api/hooks'
      - httpApi: 'DELETE /api/hooks/{id}'
      - httpApi: '*' # anything else: a 404 in the API's own error format

plugins:
  - serverless-esbuild
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node

  serverless-offline:
    httpPort: 3000

resources:
  Outputs:
    ApiUrl:
      Description: Base URL for Make's HTTP modules and the custom app connection
      Value: !GetAtt HttpApi.ApiEndpoint
